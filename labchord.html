        (function() {
            var t = localStorage.getItem('jmrSuiteTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            window.addEventListener('message', function(e) {
                if (e && e.data && e.data.type === 'jmr-theme') {
                    var next = e.data.theme === 'light' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    try { localStorage.setItem('jmrSuiteTheme', next); } catch (err) {}
                }
            });

            const icons = {

                Volume2: <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></g>,
                VolumeX: <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></g>,
                Trash2: <g><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></g>,

                X: <g><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></g>,
                Eye: <g><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></g>,
                EyeOff: <g><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></g>,
                Save: <g><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></g>,
                Bookmark: <g><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></g>,
                Menu: <g><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></g>,
                Search: <g><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></g>,
                Edit2: <g><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></g>,
                CheckCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></g>,
                Image: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></g>,
                Download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></g>,
                UploadCloud: <g><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/><polyline points="16 16 12 12 8 16"/></g>
            };
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        const ChordNameDisplay = function({ name, className }) {
            if (!name) return null; const match = name.match(/^(.*?)\((.*?)\)(.*?)$/); if (!match) return <span className={className}>{name}</span>;
            const base = match[1]; const tensionsStr = match[2]; const suffix = match[3];
            const tensions = tensionsStr.split(',').map(t => t.trim());
            tensions.sort((a, b) => { const getNum = str => parseInt(str.replace(/\D/g, '')) || 0; return getNum(b) - getNum(a); });
            return (
                <div className={`inline-flex items-center align-middle ${className || ''}`}>
                    <span>{base}</span>
                    <span className="text-[1.4em] font-light mx-[2px] leading-none text-slate-300 translate-y-[-1px] print:text-slate-400">(</span>
                    <div className="flex flex-col text-[0.8em] leading-[1.1] text-center justify-center font-black tracking-tighter">
                        {tensions.map((t, i) => <span key={i}>{t}</span>)}
                    </div>
                    <span className="text-[1.4em] font-light mx-[2px] leading-none text-slate-300 translate-y-[-1px] print:text-slate-400">)</span>
                    <span>{suffix}</span>
                </div>
            );
        };

        const CustomModal = function({ config, onClose }) {
            if (!config.isOpen) return null;
            const [inputValue, setInputValue] = useState(config.defaultValue || '');
            useEffect(() => { setInputValue(config.defaultValue || ''); }, [config]);
            const handleConfirm = () => { if (config.type === 'prompt') { if (config.onConfirm) config.onConfirm(inputValue); } else if (config.type === 'confirm') { if (config.onConfirm) config.onConfirm(true); } else { if (config.onConfirm) config.onConfirm(); } onClose(); };
            const handleCancel = () => { if (config.type === 'confirm' && config.onCancel) config.onCancel(false); onClose(); };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm print:hidden">
                    <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl relative animate-in zoom-in-95">
                        <h3 className="text-xl font-bold text-amber-500 mb-4 flex items-center gap-2">{config.type === 'alert' ? <Icon name="AlertCircle" size={24}/> : config.type === 'confirm' ? <Icon name="Info" size={24}/> : <Icon name="Edit2" size={24}/>}{config.type === 'alert' ? 'Aviso' : config.type === 'confirm' ? 'Confirmación' : 'Entrada Requerida'}</h3>
                        <p className="text-slate-300 mb-6 whitespace-pre-wrap leading-relaxed">{config.message}</p>
                        {config.type === 'prompt' && <input type="text" className="w-full bg-[#0f172a] border border-slate-700 p-3 rounded-xl text-white font-bold focus:ring-2 ring-amber-500 outline-none transition-all mb-6" value={inputValue} onChange={e => setInputValue(e.target.value)} autoFocus />}
                        <div className="flex justify-end gap-3">
                            {(config.type === 'confirm' || config.type === 'prompt') && <button type="button" onClick={handleCancel} className="px-5 py-2.5 rounded-xl font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors">Cancelar</button>}
                            <button type="button" onClick={handleConfirm} className="px-5 py-2.5 rounded-xl font-bold bg-amber-500 text-slate-950 hover:bg-amber-400 transition-colors">Aceptar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const PdfHeader = function({ title }) {
            return (
                <div className="pdf-header text-center mb-10 pt-4" style={{display: 'none'}}>
                    <div className="flex justify-center mb-4 text-amber-500"><Icon name="GraduationCap" size={64} /></div>
                    <h1 className="text-5xl font-black text-slate-100">Laboratorio de Acordes</h1>
                    {title && <h2 className="text-2xl font-bold text-amber-500 mt-3">{title}</h2>}
                    <p className="pdf-date text-slate-400 mt-3 font-bold text-lg"></p>
                </div>
            );
        };

        const PdfFooter = function() { return <div className="pdf-footer text-center mt-16 pb-4 border-t-2 border-slate-800 pt-8 w-full" style={{display: 'none'}}><p className="text-slate-500 font-bold uppercase tracking-widest text-sm">Desarrollado por Juan Miguel Rios Redondo</p></div>; };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => { try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } catch (error) { return initialValue; } });
            const setValue = value => { try { const valueToStore = value instanceof Function ? value(storedValue) : value; setStoredValue(valueToStore); window.localStorage.setItem(key, JSON.stringify(valueToStore)); } catch (error) {} };
            return [storedValue, setValue];
        }

        const Tooltip = function({ text, children }) {
            return (
                <div className="group relative inline-flex items-center justify-center">
                    {children}
                    <div className="absolute bottom-full mb-2 hidden group-hover:block w-48 p-2.5 bg-slate-800 text-slate-100 text-[10px] rounded-lg shadow-xl z-50 text-center border border-slate-700 normal-case font-medium leading-relaxed tracking-normal">
                        {text}<div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                    </div>
                </div>
            );
        };

        const NOTE_TO_MIDI = { 'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3, 'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11 };
        const MIDI_TO_NOTE_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const MIDI_TO_NOTE_FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const DISPLAY_NOTES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const LATIN_MAP = { 'C':'Do', 'C#':'Do#', 'Db':'Reb', 'D':'Re', 'D#':'Re#', 'Eb':'Mib', 'E':'Mi', 'F':'Fa', 'F#':'Fa#', 'Gb':'Solb', 'G':'Sol', 'G#':'Sol#', 'Ab':'Lab', 'A':'La', 'A#':'La#', 'Bb':'Sib', 'B':'Si' };
        
        const translateNote = (noteStr, mode) => { if (mode !== 'latin' || !noteStr) return noteStr; let base = noteStr.replace('m', ''); let isMinor = noteStr.includes('m'); return (LATIN_MAP[base] || base) + (isMinor ? 'm' : ''); };

        const getBassNoteName = (rootName, quality, intervalMidi, contextKey) => {
            let useFlats = false;
            if (contextKey) { useFlats = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'Cm', 'Fm', 'Gm', 'Dm', 'Bbm', 'Ebm'].includes(contextKey); } 
            else {
                const cleanRoot = rootName.replace('m', '');
                if (['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(cleanRoot)) useFlats = true;
                if (['C', 'G', 'D'].includes(cleanRoot) && (quality && (quality.includes('m') || quality.includes('7') || quality.includes('dim')))) {
                    if (cleanRoot === 'D' && quality === '7') useFlats = false; else useFlats = true; 
                }
            }
            const targetMidi = (NOTE_TO_MIDI[rootName.replace('m', '')] + intervalMidi) % 12;
            return useFlats ? MIDI_TO_NOTE_FLAT[targetMidi] : MIDI_TO_NOTE_SHARP[targetMidi];
        };

        const INVERSION_NAMES_QUADS = ['Fund.', '1ra Inv.', '2da Inv.', '3ra Inv.'];
        const INVERSION_NAMES_TRIADS = ['Fund.', '1ra Inv.', '2da Inv.'];
        const STRING_TUNINGS = [64, 59, 55, 50, 45, 40]; 

        const getScaleData = (qualityId, degreeLabel) => {
            let type = '';
            if (degreeLabel) {
                let roman = '';
                if (degreeLabel.indexOf('VII') === 0) roman = 'VII'; else if (degreeLabel.indexOf('VI') === 0) roman = 'VI'; else if (degreeLabel.indexOf('IV') === 0) roman = 'IV'; else if (degreeLabel.indexOf('V') === 0) roman = 'V'; else if (degreeLabel.indexOf('III') === 0) roman = 'III'; else if (degreeLabel.indexOf('II') === 0) roman = 'II'; else if (degreeLabel.indexOf('I') === 0) roman = 'I';
                const isMinorOne = roman === 'I' && degreeLabel.includes('m') && !degreeLabel.includes('maj');
                if (roman === 'I' && !isMinorOne) type = 'jonico'; else if (roman === 'II') type = 'dorico'; else if (roman === 'III') type = 'frigio'; else if (roman === 'IV') type = 'lidio'; else if (roman === 'V') type = 'mixolidio'; else if (roman === 'VI' || isMinorOne) type = 'eolico'; else if (roman === 'VII') type = 'locrio';

        function generateRootlessVoicings(rootName, qualityId, voicingType, notationMode, extFilter = 'auto', degreeContext = '') {
            const spec = ROOTLESS_CHORD_SPECS[qualityId] || ROOTLESS_CHORD_SPECS['maj7'];
            const rootMidi = NOTE_TO_MIDI[rootName.replace('m', '')] || 0;
            const useFlats = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(rootName) || qualityId === 'm7b5' || qualityId === 'dim7';
            const displayRoot = notationMode === 'latin' ? (LATIN_MAP[rootName] || rootName) : rootName;

            const findFretsForInterval = (sNum, interval) => {
                const targetPC = (rootMidi + interval) % 12;
                const res = [];
                for (let f = 1; f <= 14; f++) {
                    if ((STRING_TUNINGS[sNum] + f) % 12 === targetPC) res.push(f);
                }
                return res;
            };

            const assignFingers = (notes) => calculateFingering(notes);

            const isValidRootlessVoicing = (notes) => {
                const pcs = new Set(notes.map(n => n.note % 12));
                if (pcs.size !== notes.length) return false;
                const frets = notes.map(n => n.fret);
                const minF = Math.min(...frets);
                const maxF = Math.max(...frets);
                // Regla de comodidad física en guitarra: 4 trastes en zona grave (<5), hasta 5 trastes en zona media/aguda (>=5)
                const maxAllowedSpan = minF >= 5 ? 4 : 3;
                if (maxF - minF > maxAllowedSpan) return false;
                // Verificar que sea tocable con 4 dedos (cejilla en minFret si hay varias notas ahí)
                const minFretCount = frets.filter(f => f === minF).length;
                const otherNotesCount = notes.length - minFretCount;
                const fingersNeeded = (minFretCount > 1 ? 1 : minFretCount) + otherNotesCount;
                if (fingersNeeded > 4) return false;
                // Evitar saltos extremos entre cuerdas adyacentes que tuerzan la muñeca
                const byStr = [...notes].sort((a, b) => b.string - a.string);
                for (let s = 0; s < byStr.length - 1; s++) {
                    if (Math.abs(byStr[s].fret - byStr[s + 1].fret) > maxAllowedSpan) return false;
                }
                const sortedNotes = [...notes].sort((a, b) => a.note - b.note);
                // Evitar choques de 2ª menor (1 semitono) entre voces adyacentes o de 2ªm/9ªm entre extremos
                for (let k = 0; k < sortedNotes.length - 1; k++) {
                    if (sortedNotes[k + 1].note - sortedNotes[k].note === 1) return false;
                }
                if (sortedNotes.length >= 2) {
                    const outerSpan = sortedNotes[sortedNotes.length - 1].note - sortedNotes[0].note;
                    if (outerSpan === 1 || outerSpan === 13) return false;
                }
                // Evitar choque de medio tono con la 3ª del acorde (ej. 11 justa sobre 3ª mayor)
                const thirdMidi = (rootMidi + spec.guide[0]) % 12;
                const hasThirdClash = sortedNotes.some(n => {
                    const iv = (n.note - rootMidi + 120) % 12;
                    return iv !== spec.guide[0] && Math.abs((n.note % 12) - thirdMidi) === 1 && iv === 5 && spec.guide[0] === 4;
                });
                if (hasThirdClash) return false;
                return true;
            };

            const results = [];
            const seen = new Set();

            const tryBuild = (stringSets, combos) => {
                stringSets.forEach(ss => {
                    combos.forEach(combo => {
                        if (combo.intervals.length !== ss.length) return;
                        const lists = ss.map((sNum, idx) => findFretsForInterval(sNum, combo.intervals[idx]));
                        const walk = (depth, current) => {
                            if (depth === lists.length) {
                                const frets = current.map(c => c.fret);
                                const minF = Math.min(...frets);
                                if (!isValidRootlessVoicing(current)) return;
                                const sig = current.map(c => `${c.string}:${c.fret}`).join('|');
                                if (seen.has(sig)) return;
                                seen.add(sig);
                                const tensionStr = combo.extLabels.length > 0 ? `(${combo.extLabels.join(',')})` : '';
                                results.push({
                                    formattedChordName: `${displayRoot}${spec.suffix}${tensionStr}`,
                                    name: combo.structureName,
                                    modalLabel: combo.modalLabel || '',
                                    rootMidi,
                                    quality: qualityId,
                                    dropLabel: combo.dropShort,
                                    fingering: assignFingers(current),
                                    minFret: minF,
                                    extLabels: combo.extLabels
                                });
                                return;
                            }
                            const sNum = ss[depth];
                            lists[depth].forEach(fret => {
                                walk(depth + 1, [...current, { string: sNum, fret, note: STRING_TUNINGS[sNum] + fret }]);
                            });
                        };
                        walk(0, []);
                    });
                });

            const fifth = spec.fifth;

            if (qualityId === 'm7' && extFilter === 'auto') {
                if (!degreeContext) {
                    contextExts = spec.exts.filter(e => e.label === '9' || e.label === '11');
                } else if (degreeContext.indexOf('III') === 0) {
                    contextExts = spec.exts.filter(e => e.label === 'b9' || e.label === '11' || e.label === '9');
                } else if (degreeContext.indexOf('VI') === 0 || degreeContext.indexOf('Im') === 0 || degreeContext.indexOf('IVm') === 0) {
                    contextExts = spec.exts.filter(e => e.label === '9' || e.label === '11' || e.label === 'b13');
                } else {
                    contextExts = spec.exts.filter(e => e.label === '9' || e.label === '11' || e.label === '13');

            }
            const availExts = extFilter !== 'auto' ? spec.exts.filter(e => e.label === extFilter) : contextExts;
            const extsToUse = availExts.length > 0 ? availExts : spec.exts;

            if (voicingType === 'tipo1') {
                // Tipo 1: 3 notas en cuerdas 4-3-2 ([3, 2, 1]), cualquier orden de 3, 5 y 7
                const perms = [
                    [third, fifth, seventh],
                    [third, seventh, fifth],
                    [fifth, third, seventh],
                    [fifth, seventh, third],
                    [seventh, third, fifth],
                    [seventh, fifth, third]
                ];
                tryBuild(
                    [[3, 2, 1]],
                    perms.map(p => ({ intervals: p, extLabels: [], modalLabel: '', structureName: 'Cdas 4-3-2 (3ª, 5ª, 7ª)', dropShort: 'RL T1' }))
                );
            } else if (voicingType === 'tipo2') {
                // Tipo 2: 3 notas en cuerdas 4-3-2 ([3, 2, 1]), 3 y 7 (o 7 y 3) + extensión en 2ª cuerda
                const combos = [];
                extsToUse.forEach(ext => {
                    const modalLabel = ext.mode ? `Modo ${ext.mode}` : '';
                    const modeTag = modalLabel ? ` · ${modalLabel}` : '';
                    [[third, seventh], [seventh, third]].forEach(([g1, g2]) => {
                        combos.push({ intervals: [g1, g2, ext.interval], extLabels: [ext.label], modalLabel, structureName: `Cdas 4-3-2 + ${ext.label} (2ª${modeTag})`, dropShort: 'RL T2' });
                    });
                });
                tryBuild([[3, 2, 1]], combos);
                // Fallback si no hay tensión disponible cerca: usar Fundamental (0) o 5ta
                if (results.length === 0) {
                    const fb = [];
                    [[third, seventh], [seventh, third]].forEach(([g1, g2]) => {
                        fb.push({ intervals: [g1, g2, fifth], extLabels: [], modalLabel: '', structureName: 'Cdas 4-3-2 + 5ª (Base)', dropShort: 'RL T2' });
                        fb.push({ intervals: [g1, g2, 0], extLabels: [], modalLabel: '', structureName: 'Cdas 4-3-2 + Fund. (Base)', dropShort: 'RL T2' });
                    });
                    tryBuild([[3, 2, 1]], fb);
                }
            } else if (voicingType === 'tipo3') {
                // Tipo 3: 4 notas en cuerdas 4-3-2-1 ([3, 2, 1, 0]), cualquier orden tocable de 3, 5, 7 + extensión en 1ª cuerda
                const perms = [
                    [third, fifth, seventh],
                    [third, seventh, fifth],
                    [fifth, third, seventh],
                    [fifth, seventh, third],
                    [seventh, third, fifth],
                    [seventh, fifth, third]
                ];
                const combos = [];
                extsToUse.forEach(ext => {
                    const modalLabel = ext.mode ? `Modo ${ext.mode}` : '';
                    const modeTag = modalLabel ? ` · ${modalLabel}` : '';
                    perms.forEach(([a, b, c]) => {
                        combos.push({ intervals: [a, b, c, ext.interval], extLabels: [ext.label], modalLabel, structureName: `Cdas 4-3-2-1 + ${ext.label} (1ª${modeTag})`, dropShort: 'RL T3' });
                    });
                });
                tryBuild([[3, 2, 1, 0]], combos);
                if (results.length === 0) {
                    const fb = [];
                    perms.forEach(([a, b, c]) => {
                        fb.push({ intervals: [a, b, c, fifth], extLabels: [], modalLabel: '', structureName: 'Cdas 4-3-2-1 + 5ª (Base)', dropShort: 'RL T3' });
                        fb.push({ intervals: [a, b, c, 0], extLabels: [], modalLabel: '', structureName: 'Cdas 4-3-2-1 + Fund. (Base)', dropShort: 'RL T3' });
                    });
                    tryBuild([[3, 2, 1, 0]], fb);
                }
            } else if (voicingType === 'tipo4') {
                // Tipo 4: 4 notas en cuerdas 4-3-2-1 ([3, 2, 1, 0]), 3 y 7 (o 7 y 3) + doble extensión en 2ª y 1ª cuerda
                const combos = [];
                let pairs = spec.doublePairs || [];
                if (qualityId === 'm7' && extFilter === 'auto' && !degreeContext) {

                }
                pairs.forEach(([lA, lB]) => {
                    const eA = spec.exts.find(e => e.label === lA);

                    const modeName = eA.mode || eB.mode || '';
                    const modalLabel = modeName ? `Modo ${modeName}` : '';
                    [[eA, eB], [eB, eA]].forEach(([e2, e1]) => {
                        [[third, seventh], [seventh, third]].forEach(([g1, g2]) => {
                            combos.push({ intervals: [g1, g2, e2.interval, e1.interval], extLabels: [e2.label, e1.label], modalLabel, structureName: `Cdas 4-3-2-1: ${e2.label} (2ª) + ${e1.label} (1ª)`, dropShort: 'RL T4' });
                        });
                    });
                });
                tryBuild([[3, 2, 1, 0]], combos);
                // Fallback si no hay doble tensión disponible cerca: usar 5ª o Fundamental en 2ª/1ª
                if (results.length === 0) {
                    const fb = [];
                    extsToUse.forEach(ext => {
                        const modalLabel = ext.mode ? `Modo ${ext.mode}` : '';
                        [[third, seventh], [seventh, third]].forEach(([g1, g2]) => {
                            fb.push({ intervals: [g1, g2, fifth, ext.interval], extLabels: [ext.label], modalLabel, structureName: `Cdas 4-3-2-1: 5ª (2ª) + ${ext.label} (1ª)`, dropShort: 'RL T4' });
                            fb.push({ intervals: [g1, g2, 0, ext.interval], extLabels: [ext.label], modalLabel, structureName: `Cdas 4-3-2-1: Fund. (2ª) + ${ext.label} (1ª)`, dropShort: 'RL T4' });
                        });
                    });
                    tryBuild([[3, 2, 1, 0]], fb);
                }
            }

            results.sort((a, b) => {
                const scoreA = Math.abs(a.minFret - 5);
                const scoreB = Math.abs(b.minFret - 5);
                return scoreA - scoreB || a.minFret - b.minFret;
            });
            return results.slice(0, 24);
        }

                                    </div>
                                    
                                    <div className="flex-1 flex flex-col justify-start bg-[#0f172a] p-6 md:p-8 rounded-2xl border border-slate-800">
                                        <h3 className="text-xs font-black uppercase tracking-widest text-slate-500 mb-6 border-b border-slate-800 pb-3">Resultados del Análisis ({reverseNotes.length} notas)</h3>
                                        {reverseNotes.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center h-full text-slate-600 opacity-60 mt-10"><Icon name="Music" size={48} className="mb-4" /><p className="text-center font-bold text-sm">Selecciona notas en el diapasón.</p></div>
                                        ) : reverseNotes.length === 1 ? (
                                            <div className="flex flex-col items-center justify-center h-full text-amber-500 mt-10 animate-in fade-in zoom-in duration-300">
                                                <Icon name="Target" size={48} className="mb-4 drop-shadow-[0_0_15px_rgba(245,158,11,0.5)]" /><h4 className="text-2xl font-black mb-2 uppercase tracking-widest">Nota Única</h4>
                                                <p className="text-4xl font-black text-slate-100">{(() => { const n = reverseNotes[0]; const pref = n.explicitEnharmonic || 'sharps'; const namesArray = notationMode === 'latin' ? (pref === 'flats' ? MIDI_TO_NOTE_FLAT : MIDI_TO_NOTE_SHARP).map(k => translateNote(k, 'latin')) : (pref === 'flats' ? MIDI_TO_NOTE_FLAT : MIDI_TO_NOTE_SHARP); return namesArray[n.note % 12]; })()}</p>
                                            </div>
                                        ) : reverseNotes.length === 2 ? (
                                            <div className="flex flex-col items-center justify-center h-full text-sky-500 mt-10 animate-in fade-in zoom-in duration-300">
                                                <Icon name="Layers" size={48} className="mb-4 drop-shadow-[0_0_15px_rgba(14,165,233,0.5)]" /><h4 className="text-2xl font-black mb-2 uppercase tracking-widest">Intervalo Analizado</h4>
                                                <p className="text-3xl font-black text-slate-100 text-center">{getIntervalName(reverseNotes)}</p>
                                            </div>
                                        ) : detectedChords.length > 0 ? (
                                            <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                                                {detectedChords.map((match, i) => (
                                                    <div key={i} className={`p-4 rounded-xl border flex justify-between items-center transition-all ${i === 0 ? "bg-amber-500/10 border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.1)]" : "bg-slate-900 border-slate-700"}`}>
                                                        <div><div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">{match.quality}</div><div className={`font-black tracking-tight ${i === 0 ? "text-4xl text-amber-400" : "text-2xl text-slate-200"}`}><ChordNameDisplay name={match.name} /></div></div>
                                                        {i === 0 && <div className="bg-amber-500 text-slate-900 text-[10px] font-black uppercase px-3 py-1 rounded-full">Mejor Match</div>}
                                                    </div>
                                                ))}
                                            </div>
                                        ) : <div className="flex flex-col items-center justify-center h-full text-slate-500 mt-10"><Icon name="AlertCircle" size={48} className="mb-4 opacity-50" /><p className="text-center font-bold text-sm">Patrón no reconocido en BD de jazz.</p></div>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'rootless' && (
                            <div className="animate-in fade-in duration-300 pdf-export-zone w-full relative pb-24">
                                <PdfHeader title={`Rootless Voicings — ${(ROOTLESS_VOICING_TYPES.find(t => t.id === rlVoicingType) || {}).title || ''}`} />

                                <div className="flex flex-col gap-4">
                                    {/* Barra rápida Play + Volumen + Pasos justo encima de los shapes */}
                                    <div className="flex flex-wrap items-center justify-between gap-2 print:hidden hide-on-pdf">
                                        <button type="button" onClick={toggleMetronome} disabled={rootlessSequence.length === 0} className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-black flex justify-center items-center gap-2 transition-all shadow-lg ${isPlaying ? 'bg-rose-600 text-white hover:bg-rose-500' : 'bg-emerald-500 text-slate-950 hover:bg-emerald-400 disabled:opacity-40'}`}>
                                            {isPlaying ? <React.Fragment><Icon name="Play" size={14}/> Detener</React.Fragment> : <React.Fragment><Icon name="Play" size={14}/> Play ({bpm} BPM)</React.Fragment>}
                                        </button>
                                        <div className="flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-xl">
                                            <Icon name={volume > 0 && !isMuted ? "Volume2" : "VolumeX"} size={14} className="text-amber-500 shrink-0"/>
                                            <input type="range" min="0" max="100" value={volume} onChange={e => updateVolume(e.target.value)} className="w-16 sm:w-24 accent-amber-500 cursor-pointer" title="Volumen"/>
                                            <span className="text-[10px] font-bold text-slate-400 w-7 text-right">{volume}%</span>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            {rlSelectedIdx > 0 && !isPlaying && (
                                                <button type="button" onClick={() => { const next = rlSelectedIdx - 1; setRlSelectedIdx(next); if (rootlessSequence[next]) playVoicing(rootlessSequence[next].fingering, "rl-" + next); }} className="bg-slate-800 text-slate-300 px-2.5 py-2 rounded-xl font-bold hover:bg-slate-700 transition-all flex items-center shadow-md border border-slate-700"><Icon name="ArrowLeft" size={14}/></button>
                                            )}
                                            {rlSelectedIdx < rootlessSequence.length - 1 && !isPlaying && (
                                                <button type="button" onClick={() => { const next = rlSelectedIdx + 1; setRlSelectedIdx(next); if (rootlessSequence[next]) playVoicing(rootlessSequence[next].fingering, "rl-" + next); }} className="bg-slate-800 text-slate-300 px-2.5 py-2 rounded-xl font-bold hover:bg-slate-700 transition-all flex items-center shadow-md border border-slate-700"><Icon name="ArrowRight" size={14}/></button>
                                            )}
                                        </div>
                                    </div>

                                    {/* Chips horizontales de acordes / posiciones */}
                                    {rootlessSequence.length > 0 && (
                                        <div className="flex flex-nowrap overflow-x-auto no-scrollbar snap-x gap-2 pb-1 print:hidden hide-on-pdf">
                                            {rootlessSequence.map((item, i) => {
                                                const isAct = isPlaying ? activeChordIdx === i : rlSelectedIdx === i;
                                                return (
                                                    <button id={"chord-step-" + i} key={i} type="button" onClick={() => { if (!isPlaying) { setRlSelectedIdx(i); playVoicing(item.fingering, "rl-" + i); } }} className={`shrink-0 snap-center min-w-[96px] px-3 py-2 rounded-2xl border text-center transition-all ${isAct ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg scale-[1.02]' : 'border-slate-800 bg-slate-900/60 text-slate-400 hover:border-amber-500/40'}`}>
                                                        <div className={`text-[9px] font-black uppercase tracking-widest ${isAct ? 'text-slate-900' : 'opacity-65'}`}>{item.degreeLabel || `Pos. ${i + 1}`}</div>
                                                        <div className="text-sm sm:text-base font-black"><ChordNameDisplay name={item.formattedChordName} /></div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {/* Shapes horizontales */}
                                    <div className="flex flex-nowrap overflow-x-auto snap-x justify-start px-1 pb-3 gap-4 items-stretch print-grid-wrap">
                                        {rootlessSequence.length > 0 ? rootlessSequence.map((o, i) => {
                                            const isSel = isPlaying ? activeChordIdx === i : rlSelectedIdx === i;
                                            return (
                                                <div key={i} id={"rl-wrap-" + i} className={`w-full max-w-[260px] sm:max-w-[290px] shrink-0 snap-center print:w-auto print:max-w-none print:break-inside-avoid transition-all duration-300 ${isSel ? 'opacity-100 scale-100' : 'opacity-45 scale-95'}`}>
                                                    <Fretboard {...o} id={"fb-rl-" + i} contextId={"rl-" + i} activePlayingNote={activePlayingNote} dropLabel={o.dropLabel} degreeLabel={o.degreeLabel || ''} options={{labelMode, leftHanded: false, blindMode, showGhostNotes, showScales, showRootOverlay, tensionNotation, notationMode, showStaff, onPlayNote: playSingleNote}} vlRank={rlMode === 'single' ? 0 : o.vlRank} distance={o.dist} isSelected={isSel} onSelect={() => { if (!isPlaying) { setRlSelectedIdx(i); playVoicing(o.fingering, "rl-" + i); } }} onPlay={playVoicing} />
                                                </div>
                                            );
                                        }) : (
                                            <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">No hay disposiciones ergonómicas disponibles para esta combinación. Prueba otra cualidad o extensión.</div>
                                        )}
                                    </div>

                                    {/* Panel de Configuración y Filtros Rootless (Abajo) */}
                                    <div className="bg-slate-900 border border-slate-800 p-4 sm:p-5 rounded-2xl flex flex-col gap-4 print:hidden hide-on-pdf shadow-xl">
                                        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                                            <div>
                                                <h3 className="text-sm sm:text-base font-black text-amber-500 uppercase tracking-wider flex items-center gap-2"><Icon name="Layers" size={16}/> Configuración Rootless Voicings</h3>
                                                <p className="text-[11px] text-slate-400 mt-0.5">{(ROOTLESS_VOICING_TYPES.find(t => t.id === rlVoicingType) || {}).desc || ''}</p>
                                            </div>
                                            <button type="button" onClick={downloadPDF} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-emerald-400 rounded-lg border border-slate-700 text-xs font-bold flex items-center gap-1.5 transition-colors"><Icon name="Image" size={14}/> PDF</button>
                                        </div>

                                        {/* Selector de 4 Categorías Obligatorias */}
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Tipo de Voicing Rootless</label>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                                                {ROOTLESS_VOICING_TYPES.map(vt => (
                                                    <button key={vt.id} type="button" onClick={() => { setRlVoicingType(vt.id); setRlExtFilter('auto'); setRlSelectedIdx(0); setIsPlaying(false); }} className={`p-3 rounded-xl border text-left transition-all ${rlVoicingType === vt.id ? 'bg-amber-500/15 border-amber-500 text-amber-400 shadow-md' : 'bg-slate-800/60 border-slate-700 text-slate-300 hover:border-amber-500/40'}`}>
                                                        <div className="font-black text-xs">{vt.title}</div>
                                                        <div className="text-[10px] text-slate-400 mt-1 leading-snug">{vt.desc}</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Selectores: Raíz/Tonalidad, Progresión o Acorde, Extensión, BPM */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Raíz / Tonalidad</label>
                                                <select value={rlRoot} onChange={e => { setRlRoot(e.target.value); setRlSelectedIdx(0); setIsPlaying(false); }} className="w-full bg-slate-800 border border-slate-700 text-amber-400 font-bold rounded-xl p-2.5 text-sm outline-none">
                                                    {DISPLAY_NOTES.map(n => <option key={n} value={n}>{notationMode === 'latin' ? (LATIN_MAP[n] || n) : n}</option>)}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Modo / Progresión</label>
                                                <select value={rlMode} onChange={e => { setRlMode(e.target.value); setRlSelectedIdx(0); setIsPlaying(false); }} className="w-full bg-slate-800 border border-slate-700 text-white font-bold rounded-xl p-2.5 text-sm outline-none">
                                                    {ROOTLESS_PROGRESSIONS.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                                                </select>
                                            </div>

                                            {rlMode === 'single' ? (
                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Tipo de Acorde</label>
                                                    <select value={rlChordQuality} onChange={e => { setRlChordQuality(e.target.value); setRlExtFilter('auto'); setRlSelectedIdx(0); setIsPlaying(false); }} className="w-full bg-slate-800 border border-slate-700 text-white font-bold rounded-xl p-2.5 text-sm outline-none">
                                                        {Object.keys(ROOTLESS_CHORD_SPECS).map(k => <option key={k} value={k}>{ROOTLESS_CHORD_SPECS[k].label}</option>)}
                                                    </select>
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Tiempos / Acorde</label>
                                                    <input type="number" value={beatsPerChord} onChange={e => setBeatsPerChord(Math.max(1, Number(e.target.value)))} className="w-full bg-slate-800 border border-slate-700 text-white font-bold rounded-xl p-2.5 text-sm outline-none" disabled={isPlaying} />
                                                </div>
                                            )}

                                            {rlMode === 'single' && rlVoicingType !== 'tipo1' ? (
                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Extensión</label>
                                                    <select value={rlExtFilter} onChange={e => { setRlExtFilter(e.target.value); setRlSelectedIdx(0); setIsPlaying(false); }} className="w-full bg-slate-800 border border-slate-700 text-fuchsia-400 font-bold rounded-xl p-2.5 text-sm outline-none">
                                                        <option value="auto">Todas las disponibles</option>
                                                        {((ROOTLESS_CHORD_SPECS[rlChordQuality] && ROOTLESS_CHORD_SPECS[rlChordQuality].exts) || []).map(ext => (
                                                            <option key={ext.label} value={ext.label}>{ext.label}ª disponible</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">BPM Metrónomo</label>
                                                    <input type="number" value={bpm} onChange={e => setBpm(Math.max(30, Math.min(240, Number(e.target.value))))} className="w-full bg-slate-800 border border-slate-700 text-white font-bold rounded-xl p-2.5 text-sm outline-none" disabled={isPlaying} />
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <PdfFooter />
                            </div>
                        )}
                    </div>

                    <footer className="fixed bottom-4 md:bottom-5 left-1/2 -translate-x-1/2 w-[96%] md:w-[95%] max-w-5xl flex flex-col items-center gap-1 md:gap-2 z-50 print:hidden">
                        <div className="bg-black/95 backdrop-blur-xl border border-slate-800 p-1.5 md:p-2 rounded-2xl flex flex-wrap md:flex-nowrap gap-1 md:gap-2 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] w-full justify-center items-stretch [&_button]:px-2 [&_button]:py-1.5 [&_button]:text-[10px] md:[&_button]:px-3 md:[&_button]:py-2">
                            <div className="snap-center shrink-0 border-r border-slate-800 pr-1.5 md:pr-2 mr-0.5 md:mr-1">
                                <button type="button" onClick={() => setNotationMode(notationMode === 'anglo' ? 'latin' : 'anglo')} className="px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold text-sky-400 border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center h-full w-full justify-center"><Icon name="Music" size={14} className="mr-1 md:mr-1.5"/>{notationMode === 'anglo' ? 'Ver: C D E' : 'Ver: Do Re Mi'}</button>
                            </div>
                            <div className="snap-center shrink-0 border-r border-slate-800 pr-1.5 md:pr-2 mr-0.5 md:mr-1">
                                <button type="button" onClick={() => setLabelMode(labelMode==='intervals'?'notes':labelMode==='notes'?'fingers':'intervals')} className="px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold text-amber-500 border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center h-full w-full justify-center"><Icon name="Layers" size={14} className="mr-1 md:mr-1.5"/>{labelMode==='intervals'?'Grados':labelMode==='notes'?'Notas':'Dedos'}</button>
                            </div>
                            <Tooltip text="Nomenclatura de grados: 2-4-6 o Tensiones 9-11-13">
                                <button type="button" onClick={() => setTensionNotation(!tensionNotation)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${tensionNotation ? 'text-fuchsia-400 bg-fuchsia-900/20' : 'text-slate-400'}`}><span className="mr-1 md:mr-1.5 font-black text-xs">T</span>{tensionNotation ? '9-11-13' : '2-4-6'}</button>
                            </Tooltip>
                            
                            {/* Botón Nuevo Pentagrama (Fase 2) */}
                            <Tooltip text="Mostrar u ocultar la partitura musical (Pentagrama estándar)">
                                <button type="button" onClick={() => setShowStaff(!showStaff)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${showStaff ? 'text-amber-500 bg-amber-900/20' : 'text-slate-400'}`}><Icon name="Menu" size={14} className="mr-1 md:mr-1.5"/>Partitura</button>
                            </Tooltip>

                            <Tooltip text="Alterna entre rasgueo rápido o arpegio nota por nota.">
                                <button type="button" onClick={() => setAudioMode(audioMode === 'strum' ? 'arpeggio' : 'strum')} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${audioMode === 'arpeggio' ? 'text-emerald-400 bg-emerald-900/20' : 'text-slate-400'}`}><Icon name="Play" size={14} className="mr-1 md:mr-1.5"/>{audioMode === 'strum' ? 'Rasgueo' : 'Arpegio'}</button>
                            </Tooltip>
                            <Tooltip text="Muestra la Tónica teórica para ubicarte visualmente.">
                                <button type="button" onClick={() => setShowRootOverlay(!showRootOverlay)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${showRootOverlay ? 'text-rose-400 bg-rose-900/20' : 'text-slate-400'}`}><Icon name="Target" size={14} className="mr-1 md:mr-1.5"/>Tónica</button>
                            </Tooltip>
                            <Tooltip text="Ilumina las notas de la escala correspondiente al acorde.">
                                <button type="button" onClick={() => setShowScales(!showScales)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${showScales ? 'text-indigo-400 bg-indigo-900/20' : 'text-slate-400'}`}><Icon name="Menu" size={14} className="mr-1 md:mr-1.5"/>Escala</button>
                            </Tooltip>
                            <Tooltip text="Voice Leading: Muestra el rastro del acorde anterior.">
                                <button type="button" onClick={() => setShowGhostNotes(!showGhostNotes)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${showGhostNotes ? 'text-sky-400 bg-sky-900/20' : 'text-slate-400'}`}><Icon name="Shuffle" size={14} className="mr-1 md:mr-1.5"/>Rastro</button>
                            </Tooltip>
                            <Tooltip text="Modo a ciegas: Oculta los diagramas para practicar de oído.">
                                <button type="button" onClick={() => setBlindMode(!blindMode)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center shrink-0 snap-center h-full justify-center ${blindMode ? 'text-amber-400 bg-amber-900/20' : 'text-slate-400'}`}>{blindMode ? <Icon name="EyeOff" size={14} className="mr-1 md:mr-1.5"/> : <Icon name="Eye" size={14} className="mr-1 md:mr-1.5"/>}Ciegas</button>
                            </Tooltip>
                            <div className="snap-center shrink-0 border-l border-slate-800 pl-1.5 md:pl-2 ml-0.5 md:ml-1">
                                <button type="button" onClick={() => setIsMuted(!isMuted)} className={`px-3 py-2 md:px-4 md:py-2 text-[10px] md:text-[11px] font-bold border border-slate-700 rounded-xl hover:bg-slate-900 transition-colors flex items-center h-full w-full justify-center ${isMuted ? 'text-rose-500' : 'text-emerald-500'}`}>{isMuted ? <Icon name="VolumeX" size={14} className="mr-1 md:mr-1.5"/> : <Icon name="Volume2" size={14} className="mr-1 md:mr-1.5"/>}{isMuted ? 'Off' : 'On'}</button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
